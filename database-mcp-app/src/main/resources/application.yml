server:
  port: 8686

management:
  endpoints:
    # Boot 4 的访问模型：endpoint 的开关不再是布尔值，而是 none / read-only / unrestricted 三档，
    # 且 max-permitted 会给所有 endpoint 的访问级别封顶——即便某个 endpoint 被单独配成
    # unrestricted 也只能到 read-only。本服务暴露的 health/info/metrics/prometheus 全是只读的，
    # 没有任何写操作需求，所以在这里一次性封顶，比逐个 endpoint 配更难配错。
    access:
      max-permitted: read-only
    web:
      exposure:
        # Keep the exposed surface to the operational essentials. env/beans/mappings/loggers/
        # configprops/threaddump/heapdump leak configuration, credentials and memory contents;
        # 只有 entropy.mcp.security.enabled=false 时它们才是 permitAll 的（鉴权打开后
        # health/info 之外的 actuator 端点都要求认证），所以这份白名单不能放宽。
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # /actuator/health 对探针匿名开放（见 SecurityConfig），always 会把每个组件的明细一并给出，
      # 其中 db 组件在故障时会回显驱动异常（含 JDBC URL）。明细只给已认证的调用方。
      show-details: when-authorized
      probes:
        enabled: true

logging:
  level:
    # 这三个 logger 一旦调到 DEBUG，MCP SDK 会把每一条 JSON-RPC 报文原样打进日志
    # （io.modelcontextprotocol.spec.McpSchema 的 "Received JSON message"）。
    # createNamedConnection 的 password 就在报文里，等于把目标库口令明文写进日志文件——
    # jdbcUrlMasked 那一套遮蔽全白做。所以默认必须停在 INFO。
    # 排查协议问题时临时开启：--logging.level.io.modelcontextprotocol=DEBUG，
    # 并且只在没有真实凭证的环境里开。
    org.springframework.ai.mcp: INFO
    io.modelcontextprotocol: INFO
    org.springframework.ai.tool: INFO

spring:
  # 审计库（默认不配，审计只写文件 + 内存环形缓冲）。
  #
  # 这条 URL 的存在与否是 AuditLogRepository / AuditLogInitializer / ComplianceReportService
  # 三个 bean 的 @ConditionalOnProperty 条件，也就是「getAuditLogs / getDataAccessReport 等工具
  # 能不能查到历史」的总开关。刻意保持 opt-in：审计要么明确有个库、要么明确没有，
  # NEVER 给它一个「看起来在持久化、实际重启就没」的默认值 —— 本项目历史上正是因为
  # H2 在 classpath 上时 Boot 自动装配匿名内嵌库、审计静默落进去而 audit.enabled=true
  # 报告一切正常，吃过一次亏（见 AuditLogRepository 类注释）。
  #
  # 建表不需要手工做：AuditLogRepository 会探测产品族（H2 / PostgreSQL / MySQL / Oracle /
  # SQL Server 各一份 DDL）按需建 audit_log，但账号要有 DDL 权限。
  # NEVER 把审计库指向被审计的业务库：归属混淆，且业务库账号通常没有建表权限。
  #
  # 选项 1 —— 外部库，可留存，合规留痕场景用这个：
  # datasource:
  #   url: jdbc:postgresql://audit-db:5432/mcp_audit
  #   username: mcp
  #   password: ${MCP_AUDIT_DB_PASSWORD}
  #
  # 选项 2 —— 进程内 H2，零外部依赖，只为让审计查询工具能跑起来（本地调试 / 演示 / 冒烟）：
  # datasource:
  #   url: jdbc:h2:mem:mcp_audit;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
  #   username: sa
  #   password: ""
  #
  #   DB_CLOSE_DELAY=-1 是必需的，不是调优：缺了它，Hikari 回收掉最后一个空闲连接的那一刻
  #   H2 就丢弃整个库，audit_log 连表一起消失，而下一次写入又会重新建表 —— 表现为审计记录
  #   零星丢失、且没有任何报错。选项 2 的审计历史进程一停就没，也不在多副本间共享，
  #   所以 AuditLogInitializer 启动时会按 URL 判定内存库并打一条 WARN，
  #   NEVER 把那条 WARN 降级或删掉。
  #
  # 两个选项都可以不改本文件，用 --spring.datasource.url=... 或环境变量
  # SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD 覆盖。
  ai:
    mcp:
      server:
        name: database-mcp-server
        # 由 Maven 资源过滤填入 project.version（spring-boot-starter-parent 对
        # application*.yml 开启了 @..@ 分隔符的 filtering），避免每次发版手工同步漏改。
        version: @project.version@
        protocol: STATELESS

  main:
    banner-mode: off

entropy:
  mcp:
    # HTTP-layer authentication (Basic, plus Bearer/JWT when
    # spring.security.oauth2.resourceserver.jwt.* is configured). When true, /mcp needs an
    # authenticated principal, /api/** needs ROLE_ADMIN and every actuator endpoint other than
    # health/info needs authentication. Requires a non-blank MCP_SECURITY_ADMIN_PASSWORD —
    # without it the context fails to start (刻意的：宁可起不来，也不要带着空密码对外服务)。
    #
    # 破坏性变更（0.4.0 引入，沿用至今）：默认值由 false 改为 true。本地免密开发请显式覆盖：
    #   java -jar app.jar --entropy.mcp.security.enabled=false
    #
    # Do NOT confuse this with entropy.mcp.database.security below: that one is a different
    # switch that only tunes SQL-level guardrails (allowed-tables / max-joins /
    # max-subquery-depth) and has no effect on HTTP authentication.
    #
    # 只读运维页面（0.5.2 加入，见 WebUiController 与 static/index.html）把这个开关的影响面扩大了：
    #   enabled=false 时，除了原有的 /mcp，根路径 / 也会直接把审计流水（含 SQL 原文）、慢查询原文、
    #   SQL 模式统计与全部已注册连接（名字、方言、脱敏后的 JDBC URL）渲染成表格，
    #   对任何能访问此端口的人开放——不需要事先知道 /api/audit/logs 这类路径。
    #   这不是新增的权限，但「点开就看到」和「要知道路径才看得到」在实践中就是暴露面的差别。
    #   enabled=true 是关掉这个暴露的唯一开关：SecurityConfig 会把 /api/** 与页面静态资源
    #   （/、/index.html、/ui.css、/ui.js）一起收进 ROLE_ADMIN，两者始终同一档。
    #   页面顶部那条不可关闭的红色横幅由 /api/ui/config 的 authEnabled 驱动，也就是由本键驱动，
    #   NEVER 把它改成写死的文案或可关闭的提示。
    security:
      enabled: true
      # 密文凭证（默认关闭）。私钥在就启用：服务端持私钥，运维持公钥，
      # 用 CredentialSealCli keygen / seal 生成。启用后多出 createSealedConnection，
      # 调用方只传连接名 + jdbcUrl + 一段密文，账号口令不进模型上下文与对话历史。
      # 私钥只从环境变量读，不要写进任何配置文件或镜像；变量没设=空串=机制关闭，服务照常起来。
      credential-cipher:
        private-key: ${MCP_CREDENTIAL_PRIVATE_KEY:}
        # 运行时注册允许的最长剩余有效期；密文在有效期内可重放，所以这就是重放窗口。
        max-ttl: 15m
        # true = createNamedConnection 拒收明文口令，运行时注册只剩密文一条路。
        # 这是会让现有客户端立刻报错的开关，默认留 false。
        require-sealed-credentials: false
    database:
      enabled: true
      dialect: generic
      query:
        max-rows: 100
        # Also the read statement ceiling — see statement-timeout below.
        timeout-seconds: 30
        max-result-rows: 10000
        max-export-rows: 500
        fetch-size: 100
      # Statement ceilings per work category. Every JDBC statement gets one: an unbounded statement
      # holds its request thread until the driver's own socket timeout expires, so a few slow ones
      # can consume the whole servlet thread pool. The read ceiling lives in query.timeout-seconds
      # above so there is a single key per category.
      # Hitting a ceiling means the statement is aborted — pick the matching category rather than
      # raising a ceiling for work that belongs in another one.
      statement-timeout:
        write-seconds: 120
        ddl-seconds: 300
        etl-seconds: 600
      audit:
        enabled: true
        retention-days: 7
        sql-truncate-length: 200
        entry-sql-truncate-length: 500
        slow-query-threshold-ms: 5000
        max-slow-queries: 1000
        max-sql-patterns: 500
      quality:
        enabled: true
        max-sample-rows: 10000
        default-null-rate-threshold: 0.05
        default-duplicate-rate-threshold: 0.01
        alert-on-critical: true
        alert-threshold-issues: 3
      # DDL 执行闸门，默认关闭。开启等于允许 MCP 调用方修改库结构（建表、改列、删索引），
      # 而 Oracle/MySQL 的 DDL 隐式提交、出错无法回滚，误操作只能人工反向修复。
      # 关闭时 executeDdl / executeDdlBatch / executeDdlRemote / createMirrorTable 一律拒绝；
      # validateDdl 不受影响（只做语法校验、不连库），预检能力刻意保留。
      ddl:
        allowed: false
      security:
        # SQL-level guardrails only. HTTP authentication is entropy.mcp.security.enabled.
        # Empty allowed-tables means no table restriction.
        allowed-tables: []
        max-joins: 10
        max-subquery-depth: 5
      etl:
        thread-pool-size: 4
        batch-size: 1000
      # Widths of the process-wide pools. Every one of these runs blocking JDBC, so they are
      # absolute numbers rather than multiples of the CPU count.
      thread-pool:
        # @Async audit/compliance writes. CallerRuns on overflow, so a full queue slows the
        # request thread instead of dropping audit records.
        async-core-size: 4
        async-max-size: 8
        async-queue-capacity: 100
        # Queue in front of the ETL pool; the pool width itself is etl.thread-pool-size above.
        etl-queue-capacity: 50
        # Cross-database fan-out in FederatedQueryGateway.
        federated-query-size: 10
        # Shared bound on concurrent per-table catalog generation across all scanSchema calls.
        catalog-scan-size: 4
        # @Scheduled tasks. Spring's default is a single thread.
        scheduler-size: 2
      cache:
        # Process-wide entry budget shared by every BYOK connection: one Caffeine instance is
        # created for the whole JVM and keys are scoped per connection. Before that, one cache
        # of this size existed per connection, so the real ceiling was
        # max-size x byok.max-cached-connections on a heap sized for a single cache.
        max-size: 2000
        query-ttl: 30s
        metadata-ttl: 5m
        max-warm-size: 10
      # ── 预声明连接（推荐的默认路径）─────────────────────────────────────────
      # 由部署方声明、启动时建成 pinned 池，进程存活期间一直可用、不会像 BYOK 那样到期失效。
      # 工具按名引用，下游分不出它和 BYOK 连接的区别：两者走同一个 ByokDataSourceFactory，
      # 因此同样受 SQL 校验、脱敏、审计与语句超时约束。
      #
      # 为什么优先用这条路径：BYOK 要求调用方把数据库密码作为 createNamedConnection 的入参传进来，
      # 那条链路会让密码进入模型上下文、并留在客户端保存的对话历史里。预声明之后，对话里从头到尾
      # 只出现连接名，凭证一步都不经过模型。
      #
      # 默认为空（BYOK-only）。按需取消注释；密码务必走 ${ENV_VAR}，不要写明文。
      # connections:
      #   oracle-prod:
      #     jdbc-url: jdbc:oracle:thin:@//db-host:1521/ORCLPDB
      #     username: mcp_reader
      #     password: ${ORACLE_PASSWORD}
      #     readonly: true      # 拒绝经此连接的写入
      #     required: true      # 连不上则启动失败；false 时只告警并跳过
      #   analytics:
      #     jdbc-url: jdbc:postgresql://analytics-host:5432/warehouse
      #     username: mcp_reader
      #     password: ${ANALYTICS_PASSWORD}
      #     readonly: true
      byok:
        # 运行时由调用方创建的连接（BYOK）。密码作为 createNamedConnection 的入参传入，因此会进入
        # 模型上下文与客户端保存的对话历史——这条路径只适合临时接入。
        #
        # 固定的那几个库请改用上面的 connections 预声明：对话里只出现连接名，凭证一步都不经过模型。
        lease-duration: 1h
        max-lifetime: 2h
        cleanup-interval: 5m
        max-cached-connections: 100
        pool-size: 10
        min-idle: 2
        url-guard:
          # Which driver and which host a caller may point us at is deployment policy, and this is a
          # BYOK gateway: both stay unrestricted by default so existing connections keep working.
          # Empty allowed-drivers means every jdbc: scheme is allowed.
          allowed-drivers: []
          # Empty blocked-hosts means no host is blocked. An entry starting with "." or "*." matches
          # by domain suffix, e.g. ".internal".
          blocked-hosts: []
          # 默认拦内网：BYOK 的连接地址由调用方指定，不拦等于把服务变成内网端口探测器与云元数据
          # （169.254.169.254）的代理。判定覆盖 localhost、RFC1918、169.254、IPv6 ULA/link-local，
          # 以及 127.1 / 2130706433 / 0x7f.0.0.1 这些等价写法。
          # 本地开发连本机数据库时显式改成 false。
          block-private-networks: true

          # On by default: this is the real remote-code-execution vector, not the host. Rejects the
          # JDBC URL parameters that turn a connection string into code execution or local file
          # access - H2 INIT / RUNSCRIPT, MySQL allowLoadLocalInfile / allowUrlInLocalInfile /
          # autoDeserialize / socketFactory / queryInterceptors / statementInterceptors, and friends.
          reject-dangerous-url-parameters: true
      connection-pool:
        connection-timeout: 30s
        idle-timeout: 10m
        max-lifetime: 30m
      prepared-statement:
        cache-size: 250
        cache-sql-limit: 2048
      metrics:
        slow-query-threshold-ms: 5000
      backup:
        # 备份记录（含 SQL 脚本全文）只存在进程内存里，重启即全部丢失，本服务不落盘也不建表。
        # max-records / retention-days 是这块内存的硬上限，超出即静默淘汰，之后 restoreBackup /
        # quickRestore 会报 NOT_FOUND。备份脚本全文常驻堆内，这两个值是唯一的 OOM 闸门。
        #
        # 破坏性变更（0.4.0 引入，沿用至今）：删掉了 auto-cleanup / default-backup-schema / recover-mode-cascade
        #   三个从未被读取的键；新增 max-records；retention-days 默认由 30 改为 7 并真正生效——
        #   此前它只管手工调用的 cleanupBackups，内存里的 7 天硬过期是写死的常量，配 30 是谎报。
        enabled: true
        incremental-enabled: true
        max-backup-rows: 500000
        max-records: 200
        retention-days: 7
      lineage:
        enabled: true
        foreign-key-enabled: true
        view-dependency-enabled: true
        max-traversal-depth: 10
        auto-analyze: true
        max-tables-per-graph: 200
      optimizer:
        enabled: true
        max-suggestions-per-query: 10
        max-index-recommendations: 5
        enable-composite-index-analysis: true
      catalog:
        enabled: true
        auto-generate-comments: true
        enable-sensitive-detection: true
        max-search-results: 100
      cdc:
        enabled: true
        enable-realtime-streaming: false
        max-events-per-poll: 1000
        default-poll-interval-ms: 1000
        enable-mirror-tables: true
        max-mirror-tasks: 10
        enable-event-listeners: true
    gateway:
      enabled: true
    monitoring:
      pool:
        enabled: true
    # MCP 工具暴露面。全部工具（约 130 个）全量进 tools/list 时，模型每轮都要读完整的工具描述，
    # 既涨 token 也让相近工具（getStatistics / getPoolStats、backupTable /
    # exportQueryToTable）更容易被选错。这里的裁剪发生在启动期：不在清单里的工具根本不会
    # 出现在 tools/list，而不是调用时才报错。
    #
    # 三个开关全空（当前默认）= 不裁剪，行为与 0.1.3 一致。生效顺序：
    #   groups（非空则只留这些分组） → 并入 include → 减去 exclude（优先级最高）
    #
    # 分组名由工具类名推导，去掉尾部 Tools 后转 kebab-case，可用值：
    #   query / schema / ddl-execution / export / query-analysis / optimization
    #   database-health / pool-monitor / cache-admin / connection-admin / sql-audit
    #   etl / cdc / backup / catalog / lineage / quality / cross-database
    #   mcp-session-dispatch / oracle-session / intent-router
    # 启动日志会打印 "MCP tool exposure: X of Y tools registered" 与每组保留数量。
    #
    # 注意：include/exclude/groups 里写了不存在的名字会直接启动失败，不会静默忽略。
    # 这是刻意的——工具改名后配置悄悄失效比启动报错难查得多。改工具名时记得同步这里。
    #
    # 数据面（只读查询，高并发，可多副本）：plane=data 按工具描述里的 标签：[...] 自动切分，
    #   带 read 且不带 write/ddl/destructive/admin 的才留下。约留下四分之三，准确数量看启动日志
    #   打印的 "MCP tool exposure: X of Y tools registered"（这里不钉快照数字：加一个工具就会过期）。
    #   比手写 groups 白名单准：cross-database 里的联邦查询留下、createDbLink/dropDbLink 摘掉。
    # 控制面（备份恢复、ETL、CDC、DDL，单副本）：plane=control，是 data 的补集。
    # 标签缺失的新工具会落进 control——对暴露面最大的数据面 fail-closed。
    # include 刻意能穿透 plane，用于"数据面额外放一个受控写工具"。
    # plane 是暴露面收敛手段，不是安全边界：真正的闸是 ddl.allowed 与 entropy.mcp.security.*，
    #   它们拦的是执行——摘掉工具不等于禁用能力，放进来也不等于放行。
    #
    # plane=data 下 connection-admin 只保留 3 个只读工具（listConnections / describeConnection /
    #   getConnectionCount）；createNamedConnection 带 write 标签，仍属控制面。所以纯数据面副本
    #   能查看和校验连接，但注册要么靠 include: [createNamedConnection] 穿透，要么由控制面副本统一做。
    #   （0.4.0 之前这三个只读工具误带 admin 标签，整组都进不了数据面，见 ToolPlane 的注释。）
    #   createSealedConnection 同样带 write 标签，也在控制面。
    #
    # 开箱预设（profile 形式，可与 production 叠加，逗号分隔，后者优先）：
    #   --spring.profiles.active=production,tools-explore   查询与探索        23 个
    #   --spring.profiles.active=production,tools-dba        DBA 诊断          31 个
    #   --spring.profiles.active=production,tools-govern     目录/血缘/质量    36 个
    # 对应 application-tools-*.yml，各文件头部写了覆盖范围与依赖的其他开关。
    #
    # 收敛专家级低频操作参考配置：
    #   exclude: [flashbackQuery, createDbLink, dropDbLink, showBlockingTree, killSession]
    tools:
      plane: all          # all / data / control；写别的值直接启动失败
      groups: []
      include: []
      exclude: []
