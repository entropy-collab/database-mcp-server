<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Database MCP Server — 只读运维面板</title>
<!--
  纯静态页面：没有构建步骤、没有 npm、没有 CDN。目标环境是准离网的 K8s 命名空间，
  任何外链资源只会加载失败，所以样式与脚本都是同目录下的本地文件。
  这个页面是只读的：它只发 GET，不提供任何能改动服务或数据库的入口。
-->
<link rel="stylesheet" href="ui.css">
</head>
<body>
<div id="auth-banner" class="banner hidden" role="alert"></div>

<header>
  <h1>Database MCP Server</h1>
  <div class="toolbar">
    <label>条数
      <input id="limit" type="number" value="50" min="1" max="500">
    </label>
    <label class="inline">
      <input id="autorefresh" type="checkbox"> 自动刷新（10s）
    </label>
    <button id="refresh" type="button">刷新</button>
    <span id="updated" class="muted"></span>
  </div>
</header>

<nav class="tabs" role="tablist">
  <button class="tab active" data-tab="audit" role="tab">审计流水（内存）</button>
  <button class="tab" data-tab="history" role="tab">审计历史（落库）</button>
  <button class="tab" data-tab="connections" role="tab">连接与连接池</button>
  <button class="tab" data-tab="performance" role="tab">性能</button>
</nav>

<main>
  <section id="panel-audit" class="panel">
    <p class="muted">进程内环形缓冲，重启即清空。来源 <code>GET /api/audit/logs</code>。</p>
    <div id="err-audit" class="error hidden"></div>
    <div id="table-audit"></div>
  </section>

  <section id="panel-history" class="panel hidden">
    <p class="muted">
      持久化审计表。<strong>审计落库是 opt-in 的</strong>：没有配置
      <code>spring.datasource.url</code> 时这一页永远是空的，接口会返回 503。
      来源 <code>GET /api/audit/history</code>。
    </p>
    <div id="err-history" class="error hidden"></div>
    <div id="table-history"></div>
  </section>

  <section id="panel-connections" class="panel hidden">
    <p class="muted">来源 <code>GET /api/ui/connections</code>。JDBC URL 已脱敏。</p>
    <div id="err-connections" class="error hidden"></div>
    <div id="sum-connections" class="cards"></div>
    <h2>已注册连接</h2>
    <div id="table-conn"></div>
    <h2>连接池</h2>
    <div id="table-pools"></div>
  </section>

  <section id="panel-performance" class="panel hidden">
    <p class="muted">来源 <code>GET /api/ui/performance</code>。全部为进程内统计，重启即清空。</p>
    <div id="err-performance" class="error hidden"></div>
    <div id="sum-performance" class="cards"></div>
    <h2>慢查询</h2>
    <div id="table-slow"></div>
    <h2>SQL 模式统计</h2>
    <div id="table-patterns"></div>
    <h2>服务指标</h2>
    <div id="table-metrics"></div>
  </section>
</main>

<script src="ui.js"></script>
</body>
</html>
