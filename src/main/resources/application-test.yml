server:
  port: 8686

spring:
  main:
    banner-mode: off

entropy:
  mcp:
    database:
      enabled: true
      dialect: h2
      query:
        max-rows: 100
        max-result-rows: 10000
      ddl:
        allowed: true
      security:
        enabled: false
        allowed-tables: []
        enable-parameterized-only: true
      masking:
        column-patterns:
          - email
          - phone
    gateway:
      enabled: false
    test-data:
      enabled: true
