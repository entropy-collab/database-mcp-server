server:
  port: 0

spring:
  datasource:
    primary:
      jdbc-url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
      username: sa
      password:
      driver-class-name: org.h2.Driver
      maximum-pool-size: 5

  main:
    banner-mode: off

entropy:
  mcp:
    database:
      enabled: true
      dialect: generic
      query:
        max-rows: 100
        max-result-rows: 10000
      ddl:
        allowed: true
      security:
        enabled: false
        allowed-tables: []
        enable-parameterized-only: true
      masking:
        column-patterns:
          - email
          - phone
    gateway:
      enabled: false
    test-data:
      enabled: true
