server:
  port: 8686

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,beans,mappings,loggers,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    metrics:
      enabled: true
    loggers:
      enabled: true

logging:
  level:
    org.springframework.ai.mcp: DEBUG
    io.modelcontextprotocol: DEBUG
    org.springframework.ai.tool: DEBUG

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
  ai:
    mcp:
      server:
        name: database-mcp-server
        version: 0.1.0
        protocol: STATELESS
        tool-callback:
          auto-detect: true

  main:
    banner-mode: off

entropy:
  mcp:
    database:
      enabled: true
      dialect: generic
      query:
        max-rows: 100
        timeout-seconds: 30
        max-result-rows: 10000
        max-export-rows: 500
        fetch-size: 100
      audit:
        enabled: true
        retention-days: 7
        sql-truncate-length: 200
        entry-sql-truncate-length: 500
        slow-query-threshold-ms: 5000
        max-slow-queries: 1000
        max-sql-patterns: 500
      quality:
        enabled: true
        max-sample-rows: 10000
        default-null-rate-threshold: 0.05
        default-duplicate-rate-threshold: 0.01
        alert-on-critical: true
        alert-threshold-issues: 3
      ddl:
        allowed: true
      security:
        enabled: false
        allowed-tables: []
        enable-parameterized-only: true
        max-joins: 10
        max-subquery-depth: 5
      etl:
        thread-pool-size: 4
        batch-size: 1000
      cache:
        max-size: 1000
        query-ttl: 30s
        metadata-ttl: 5m
        max-warm-size: 10
      byok:
        lease-duration: 2h
        max-lifetime: 4h
        cleanup-interval: 5m
        max-cached-connections: 100
        pool-size: 10
        min-idle: 2
      connection-pool:
        connection-timeout: 30s
        idle-timeout: 10m
        max-lifetime: 30m
      prepared-statement:
        cache-size: 250
        cache-sql-limit: 2048
      metrics:
        slow-query-threshold-ms: 5000
      backup:
        enabled: true
        incremental-enabled: true
        max-backup-rows: 500000
        retention-days: 30
        auto-cleanup: true
        default-backup-schema: backup_schema
        recover-mode-cascade: true
      lineage:
        enabled: true
        foreign-key-enabled: true
        view-dependency-enabled: true
        max-traversal-depth: 10
        auto-analyze: true
        max-tables-per-graph: 200
      optimizer:
        enabled: true
        max-suggestions-per-query: 10
        max-index-recommendations: 5
        enable-composite-index-analysis: true
      catalog:
        enabled: true
        auto-generate-comments: true
        enable-sensitive-detection: true
        max-search-results: 100
      cdc:
        enabled: true
        enable-realtime-streaming: false
        max-events-per-poll: 1000
        default-poll-interval-ms: 1000
        enable-mirror-tables: true
        max-mirror-tasks: 10
        enable-event-listeners: true
    gateway:
      enabled: true
    monitoring:
      pool:
        enabled: true
