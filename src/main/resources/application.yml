server:
  port: 8686

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,beans,mappings,loggers,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    metrics:
      enabled: true
    loggers:
      enabled: true

logging:
  level:
    org.springframework.ai.mcp: DEBUG
    io.modelcontextprotocol: DEBUG
    org.springframework.ai.tool: DEBUG

spring:
  ai:
    mcp:
      server:
        name: database-mcp-server
        version: 0.1.0
        protocol: STATELESS

  main:
    banner-mode: off

entropy:
  mcp:
    database:
      enabled: true
      dialect: generic
      query:
        max-rows: 100
        timeout-seconds: 30
        max-result-rows: 10000
        max-export-rows: 500
        fetch-size: 100
      audit:
        enabled: true
        retention-days: 7
        sql-truncate-length: 200
        entry-sql-truncate-length: 500
      ddl:
        allowed: true
      security:
        enabled: false
        allowed-tables: []
        enable-parameterized-only: true
        max-joins: 10
        max-subquery-depth: 5
      etl:
        thread-pool-size: 4
        batch-size: 1000
      cache:
        max-size: 1000
        query-ttl: 30s
        metadata-ttl: 5m
        max-warm-size: 10
      connection-pool:
        connection-timeout: 30s
        idle-timeout: 10m
        max-lifetime: 30m
      prepared-statement:
        cache-size: 250
        cache-sql-limit: 2048
      metrics:
        slow-query-threshold-ms: 5000
    gateway:
      enabled: true
    monitoring:
      pool:
        enabled: true
